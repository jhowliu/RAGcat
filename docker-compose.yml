# Local dependencies. DynamoDB Local stands in for the single RAGcat table; Valkey holds the
# parse/embed queues for `make backend` + `make worker` (and the cache if RAGCAT_CACHE=valkey).
# Host port 6380 so it doesn't collide with another Redis on 6379.
services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    user: root
    ports: ["8001:8000"]
    volumes: ["dynamodb-data:/data"]

  valkey:
    image: valkey/valkey:8.1-alpine
    ports: ["6380:6379"]

volumes:
  dynamodb-data:
