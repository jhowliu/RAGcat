<script src="dc-runtime.js"></script>
<script>
const PLANS = {
  en: [
    { name: "Free", blurb: "Evaluate the full workflow", m: 0, y: 0, rows: ["1 Assistant", "1 Discord channel", "50 pages read, one time", "100 answers, one time"], cta: "Start free", primary: true },
    { name: "Starter", blurb: "For a single support desk", m: 19, y: 190, rows: ["2 Assistants", "500 pages read per month", "2,000 answers per month"], cta: "Choose Starter" },
    { name: "Growth", blurb: "For multiple product lines", m: 49, y: 490, rows: ["10 Assistants", "2,000 pages read per month", "10,000 answers per month"], cta: "Choose Growth" }
  ],
  zh: [
    { name: "Free", blurb: "完整評估整個流程", m: 0, y: 0, rows: ["1 個助理", "1 個 Discord 頻道", "讀取 50 頁（一次性）", "100 次回答（一次性）"], cta: "免費開始", primary: true },
    { name: "Starter", blurb: "適合單一客服團隊", m: 19, y: 190, rows: ["2 個助理", "每月讀取 500 頁", "每月 2,000 次回答"], cta: "選擇 Starter" },
    { name: "Growth", blurb: "適合多條產品線", m: 49, y: 490, rows: ["10 個助理", "每月讀取 2,000 頁", "每月 10,000 次回答"], cta: "選擇 Growth" }
  ]
};
const SUFFIX = { en: { mo: "/ month", yr: "/ year" }, zh: { mo: "/ 月", yr: "/ 年" } };

class Component extends DCLogic {
  state = { lang: "en", billing: "monthly" };

  renderVals() {
    const lang = this.state.lang;
    const annual = this.state.billing === "annual";
    return {
      en: lang === "en",
      zh: lang === "zh",
      enPressed: lang === "en" ? "true" : "false",
      zhPressed: lang === "zh" ? "true" : "false",
      setEn: () => this.setState({ lang: "en" }),
      setZh: () => this.setState({ lang: "zh" }),
      moPressed: annual ? "false" : "true",
      yrPressed: annual ? "true" : "false",
      setMonthly: () => this.setState({ billing: "monthly" }),
      setAnnual: () => this.setState({ billing: "annual" }),
      plans: PLANS[lang].map((p) => ({
        name: p.name, blurb: p.blurb, rows: p.rows, cta: p.cta,
        price: "$" + (annual ? p.y : p.m),
        suffix: p.m === 0 ? "" : (annual ? SUFFIX[lang].yr : SUFFIX[lang].mo),
        ctaClass: "btn " + (p.primary ? "btn-dark" : "btn-line")
      }))
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
