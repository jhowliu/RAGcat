<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAGcat · Processing · Step 1</title>
<!-- Source of truth for tokens: ../tokens/tokens.css · component specs: ../DESIGN.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Serif+TC:wght@500;600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FAF8F4}
a{color:#1F1D1C}a:hover{color:#1F1D1C}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid #1F1D1C;outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:16px;padding-right:16px}
.serif{font-family:'Source Serif 4','Noto Serif TC',serif;font-weight:600;letter-spacing:-0.015em}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;box-sizing:border-box;border:1px solid #1F1D1C;border-radius:8px;font:inherit;font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color 140ms ease-out}
.btn-dark{background:#1F1D1C;color:#FAF8F4}.btn-dark:hover{background:#3A3634;color:#FAF8F4}
.btn-line{background:#FFFFFF;color:#1F1D1C}.btn-line:hover{background:#F2EEE7}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-text{min-height:44px;padding:0 4px;border:0;background:transparent;font:inherit;font-size:15px;color:#1F1D1C;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.navlink{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;margin-right:18px;border-bottom:2px solid transparent;font-size:15px;text-decoration:none;color:#5C5754;white-space:nowrap}
.navlink[aria-current="page"]{border-bottom-color:#1F1D1C;color:#1F1D1C;font-weight:600}
.navlink:hover{color:#1F1D1C}
.app-nav{order:3;width:100%;overflow-x:auto}
.ibtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;border:1px solid #D9D2C7;border-radius:8px;background:#FFFFFF;cursor:pointer}
.ibtn:disabled{opacity:0.4;cursor:not-allowed}
.panel{background:#FFFFFF;border:1px solid #E4DED5;border-radius:12px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #E4DED5}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;white-space:nowrap}
.chip-warn{background:#FBF0D2;color:#6B4A12}
.chip-info{background:#E7F1F6;color:#2C556A}
.chip-neutral{background:#EFEAE2;color:#4B4643}
.chip-attn{background:#FFFFFF;box-shadow:inset 0 0 0 1px #1F1D1C;color:#1F1D1C}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.field{width:100%;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid #CFC6BA;border-radius:8px;background:#FFFFFF;font:inherit;font-size:16px;color:#1F1D1C}
.lbl{font-size:14px;font-weight:500}
.hint{font-size:13px;color:#6B6561}
.seg{min-height:34px;padding:0 12px;border:0;border-radius:5px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#3F3B39;cursor:pointer;white-space:nowrap}
.seg[aria-pressed="true"],.seg[aria-selected="true"]{background:#1F1D1C;color:#FAF8F4}
.tabbtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 2px;margin-right:22px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:15px;color:#5C5754;cursor:pointer;white-space:nowrap}
.tabbtn[aria-selected="true"]{border-bottom-color:#1F1D1C;color:#1F1D1C;font-weight:600}
.cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;padding:0 6px;border-radius:4px;background:#EFEAE2;color:#4B4643}
.cnt-attn{background:#FFFFFF;box-shadow:inset 0 0 0 1px #1F1D1C;color:#1F1D1C}
.tool{min-height:32px;padding:0 10px;border:1px solid #CFC6BA;border-radius:6px;background:#FFFFFF;font:inherit;font-size:13px;color:#1F1D1C;cursor:pointer}
.tool:disabled{opacity:0.4;cursor:not-allowed}
.st-lbl{display:none;font-size:14px;white-space:nowrap}
.st-lbl.cur{display:inline}
.two{display:grid;gap:20px;align-items:start}
.cards{display:grid;gap:16px;margin:0;padding:0;list-style:none;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.acard{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:210px;box-sizing:border-box;padding:20px;text-decoration:none;transition:border-color 140ms ease-out}
.acard:hover{border-color:#1F1D1C}
.desk-flex,.desk-grid,.desk-inline{display:none}
.phone-flex{display:flex}
.phone-block{display:block}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.drow.desk-grid{display:none}
.pane{display:none;flex-direction:column;min-width:0}
.pane.on{display:flex}
.panes{display:grid}
@media (min-width:768px){
.wrap{padding-left:32px;padding-right:32px}
.app-nav{order:0;width:auto}
.st-lbl{display:inline}
.desk-grid{display:grid}.drow.desk-grid{display:grid}.desk-inline{display:inline-flex}
.phone-block{display:none}
.drow{grid-template-columns:minmax(0,1fr) 70px 110px 200px 56px}
}
@media (min-width:1024px){
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
.desk-flex{display:flex}
.phone-flex{display:none}
.panes{grid-template-columns:minmax(0,0.95fr) minmax(0,1.05fr)}
.pane-src{display:flex;border-right:1px solid #E4DED5}
.pane-psg.dk{display:flex}
.pane{height:700px}
.scroll{overflow:auto}
}
@media (prefers-reduced-motion: reduce){.btn,.acard{transition:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #FAF8F4; color: #1F1D1C; font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif; font-size: 16px; line-height: 1.6">
<header style="position: sticky; top: 0; z-index: 10; background: rgba(250, 248, 244, 0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #E4DED5">
<div class="wrap" style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 0 20px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px">
<a href="#home" style="display: flex; align-items: center; gap: 10px; text-decoration: none"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14V4.5l6.5 4.5h9L27 4.5V14c0 7.2-4.9 13-11 13S5 21.2 5 14z" fill="#1F1D1C"></path><circle cx="12.2" cy="16" r="3" fill="#FAF8F4"></circle><circle cx="19.8" cy="16" r="3" fill="#FAF8F4"></circle><rect x="15" y="15.3" width="2" height="1.4" fill="#FAF8F4"></rect></svg><span style="font-size: 18px; font-weight: 600">RAGcat</span></a>
<nav aria-label="App" class="app-nav" style="display: flex">
<a href="#assistants" class="navlink" aria-current="page">Assistants</a>
<a href="#usage" class="navlink">Usage</a>
<a href="#billing" class="navlink">Billing</a>
</nav>
<div style="display: flex; align-items: center; gap: 8px"><span class="desk-inline" style="align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 1px solid #D9D2C7; border-radius: 8px; background: #FFFFFF; font-size: 13px"><span class="dot" style="background: #C9962E"></span>1 task running</span>
<button type="button" class="ibtn" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0v4l2 3H4l2-3z"></path><path d="M10 20h4"></path></svg></button>
<span aria-label="Account: Jay" style="width: 36px; height: 36px; border-radius: 50%; background: #1F1D1C; color: #FAF8F4; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">J</span>
</div>
</div>
</header>
<main class="wrap" style="padding-top: 28px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 28px">
<a href="#assistants" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: #5C5754; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5754" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Assistants</a><nav aria-label="New Assistant steps"><ol style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 10px"><li aria-current="step" style="display: flex; align-items: center; gap: 8px"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #1F1D1C; color: #FAF8F4; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">1</span><span class="st-lbl cur" style="font-weight: 600">Setup</span><span class="hint" style="white-space: nowrap">· Step 1 of 3</span></li><li aria-hidden="true" style="flex: 1 1 24px; min-width: 16px; height: 1px; background: #D9D2C7"></li><li style="display: flex; align-items: center; gap: 8px; color: #8A837E"><span style="width: 26px; height: 26px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; border: 1px solid #CFC6BA; color: #8A837E; display: inline-flex; align-items: center; justify-content: center; font-size: 13px">2</span><span class="st-lbl">Review &amp; test</span></li><li aria-hidden="true" style="flex: 1 1 24px; min-width: 16px; height: 1px; background: #D9D2C7"></li><li style="display: flex; align-items: center; gap: 8px; color: #8A837E"><span style="width: 26px; height: 26px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; border: 1px solid #CFC6BA; color: #8A837E; display: inline-flex; align-items: center; justify-content: center; font-size: 13px">3</span><span class="st-lbl">Publish &amp; connect</span></li></ol></nav>
<div class="two">
<section class="panel" aria-labelledby="proc-title">
<div class="phead"><span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5754" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4H7v16h10V7z"></path><path d="M14 4v3h3"></path><path d="M9.5 12h5M9.5 15h5"></path></svg><span class="mono" style="font-size: 13px">returns-policy.pdf · 120 pages · 8.4 MB</span></span><span class="mono hint">02:14 elapsed</span></div>
<div style="padding: 24px 22px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 id="proc-title" class="serif" style="margin: 0; font-size: 30px; line-height: 1.15">Reading your PDF</h1>
<p aria-live="polite" style="margin: 0; color: #5C5754">You can leave this page. Processing continues, and you'll be notified when it's ready.</p>
</div>
<ol style="margin: 0; padding: 0; list-style: none">
<template data-for="{{stages}}" data-as="s">
<li style="display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #EDE8E0">
<span style="{{s.markStyle}}">{{s.mark}}</span>
<span style="{{s.labelStyle}}">{{s.label}}</span>
<span style="{{s.statusStyle}}">{{s.status}}</span>
</li>
</template>
</ol>
<div style="display: flex; flex-direction: column; gap: 8px">
<div role="progressbar" aria-label="Pages read" aria-valuenow="48" aria-valuemin="0" aria-valuemax="120" style="height: 4px; border-radius: 2px; background: #EDE8E0"><div style="width: 40%; height: 100%; border-radius: 2px; background: #1F1D1C"></div></div>
<div class="hint" style="display: flex; justify-content: space-between"><span>Pages read</span><span class="mono">48 / 120 · 40%</span></div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid #EDE8E0">
<div style="display: flex; gap: 10px; flex-wrap: wrap"><button type="button" class="btn btn-dark" disabled>Next: Review &amp; test</button><a href="#assistants" class="btn btn-line">Back to Assistants</a></div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span class="hint">Pages already read are still counted.</span><button type="button" class="btn-text">Cancel</button></div>
</div>
</div>
</section>

<aside class="panel" aria-labelledby="details-title">
<div class="phead"><h2 id="details-title" style="margin: 0; font-size: 15px; font-weight: 600">Assistant details</h2><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #4B4643"><span class="dot" style="background: #5E9A55"></span>Saved</span></div>
<div style="padding: 20px 18px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="a-name" class="lbl">Name</label><input id="a-name" class="field" type="text" value="Mochi Pet Co. support"><span class="hint">You can change this later.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="a-contact" class="lbl">Contact for unanswered questions</label><input id="a-contact" class="field mono" type="email" value="help@mochipet.example"><span class="hint">Shown to customers when the Assistant can't answer.</span></div>
</div>
</aside>
</div>
</main>
</div>
</template>
<script src="dc-runtime.js"></script>
<script>
const STAGES = [
  { label: "Checking the file", state: "done" },
  { label: "Reading pages", state: "active" },
  { label: "Organizing into Passages", state: "wait" },
  { label: "Ready to review", state: "wait" }
];
class Component extends DCLogic {
  renderVals() {
    return {
      stages: STAGES.map((s, i) => ({
        label: s.label,
        mark: s.state === "done" ? "✓" : String(i + 1),
        markStyle: "width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; " +
          (s.state === "done" ? "background: #E6F0E3; color: #2F5E2A" : s.state === "active" ? "background: #1F1D1C; color: #FAF8F4" : "border: 1px solid #CFC6BA; color: #8A837E"),
        labelStyle: s.state === "wait" ? "color: #8A837E" : (s.state === "active" ? "font-weight: 600" : ""),
        status: s.state === "done" ? "Done" : s.state === "active" ? "In progress" : "Waiting",
        statusStyle: "font-size: 13px; " + (s.state === "done" ? "color: #2F5E2A" : s.state === "active" ? "color: #1F1D1C; font-weight: 500" : "color: #8A837E")
      }))
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
