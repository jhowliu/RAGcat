<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAGcat · Publish & connect · Step 3</title>
<!-- Source of truth for tokens: ../tokens/tokens.css · component specs: ../DESIGN.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Serif+TC:wght@500;600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FAF8F4}
a{color:#1F1D1C}a:hover{color:#1F1D1C}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid #1F1D1C;outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:16px;padding-right:16px}
.serif{font-family:'Source Serif 4','Noto Serif TC',serif;font-weight:600;letter-spacing:-0.015em}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;box-sizing:border-box;border:1px solid #1F1D1C;border-radius:8px;font:inherit;font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color 140ms ease-out}
.btn-dark{background:#1F1D1C;color:#FAF8F4}.btn-dark:hover{background:#3A3634;color:#FAF8F4}
.btn-line{background:#FFFFFF;color:#1F1D1C}.btn-line:hover{background:#F2EEE7}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-text{min-height:44px;padding:0 4px;border:0;background:transparent;font:inherit;font-size:15px;color:#1F1D1C;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.navlink{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;margin-right:18px;border-bottom:2px solid transparent;font-size:15px;text-decoration:none;color:#5C5754;white-space:nowrap}
.navlink[aria-current="page"]{border-bottom-color:#1F1D1C;color:#1F1D1C;font-weight:600}
.navlink:hover{color:#1F1D1C}
.app-nav{order:3;width:100%;overflow-x:auto}
.ibtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;border:1px solid #D9D2C7;border-radius:8px;background:#FFFFFF;cursor:pointer}
.ibtn:disabled{opacity:0.4;cursor:not-allowed}
.panel{background:#FFFFFF;border:1px solid #E4DED5;border-radius:12px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #E4DED5}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;white-space:nowrap}
.chip-warn{background:#FBF0D2;color:#6B4A12}
.chip-info{background:#E7F1F6;color:#2C556A}
.chip-neutral{background:#EFEAE2;color:#4B4643}
.chip-attn{background:#FFFFFF;box-shadow:inset 0 0 0 1px #1F1D1C;color:#1F1D1C}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.field{width:100%;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid #CFC6BA;border-radius:8px;background:#FFFFFF;font:inherit;font-size:16px;color:#1F1D1C}
.lbl{font-size:14px;font-weight:500}
.hint{font-size:13px;color:#6B6561}
.seg{min-height:34px;padding:0 12px;border:0;border-radius:5px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#3F3B39;cursor:pointer;white-space:nowrap}
.seg[aria-pressed="true"],.seg[aria-selected="true"]{background:#1F1D1C;color:#FAF8F4}
.tabbtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 2px;margin-right:22px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:15px;color:#5C5754;cursor:pointer;white-space:nowrap}
.tabbtn[aria-selected="true"]{border-bottom-color:#1F1D1C;color:#1F1D1C;font-weight:600}
.cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;padding:0 6px;border-radius:4px;background:#EFEAE2;color:#4B4643}
.cnt-attn{background:#FFFFFF;box-shadow:inset 0 0 0 1px #1F1D1C;color:#1F1D1C}
.tool{min-height:32px;padding:0 10px;border:1px solid #CFC6BA;border-radius:6px;background:#FFFFFF;font:inherit;font-size:13px;color:#1F1D1C;cursor:pointer}
.tool:disabled{opacity:0.4;cursor:not-allowed}
.st-lbl{display:none;font-size:14px;white-space:nowrap}
.st-lbl.cur{display:inline}
.two{display:grid;gap:20px;align-items:start}
.cards{display:grid;gap:16px;margin:0;padding:0;list-style:none;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.acard{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:210px;box-sizing:border-box;padding:20px;text-decoration:none;transition:border-color 140ms ease-out}
.acard:hover{border-color:#1F1D1C}
.desk-flex,.desk-grid,.desk-inline{display:none}
.phone-flex{display:flex}
.phone-block{display:block}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.drow.desk-grid{display:none}
.pane{display:none;flex-direction:column;min-width:0}
.pane.on{display:flex}
.panes{display:grid}
@media (min-width:768px){
.wrap{padding-left:32px;padding-right:32px}
.app-nav{order:0;width:auto}
.st-lbl{display:inline}
.desk-grid{display:grid}.drow.desk-grid{display:grid}.desk-inline{display:inline-flex}
.phone-block{display:none}
.drow{grid-template-columns:minmax(0,1fr) 70px 110px 200px 56px}
}
@media (min-width:1024px){
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
.desk-flex{display:flex}
.phone-flex{display:none}
.panes{grid-template-columns:minmax(0,0.95fr) minmax(0,1.05fr)}
.pane-src{display:flex;border-right:1px solid #E4DED5}
.pane-psg.dk{display:flex}
.pane{height:700px}
.scroll{overflow:auto}
}
@media (prefers-reduced-motion: reduce){.btn,.acard{transition:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #FAF8F4; color: #1F1D1C; font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif; font-size: 16px; line-height: 1.6">
<header style="position: sticky; top: 0; z-index: 10; background: rgba(250, 248, 244, 0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #E4DED5">
<div class="wrap" style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 0 20px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px">
<a href="#home" style="display: flex; align-items: center; gap: 10px; text-decoration: none"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14V4.5l6.5 4.5h9L27 4.5V14c0 7.2-4.9 13-11 13S5 21.2 5 14z" fill="#1F1D1C"></path><circle cx="12.2" cy="16" r="3" fill="#FAF8F4"></circle><circle cx="19.8" cy="16" r="3" fill="#FAF8F4"></circle><rect x="15" y="15.3" width="2" height="1.4" fill="#FAF8F4"></rect></svg><span style="font-size: 18px; font-weight: 600">RAGcat</span></a>
<nav aria-label="App" class="app-nav" style="display: flex">
<a href="#assistants" class="navlink" aria-current="page">Assistants</a>
<a href="#usage" class="navlink">Usage</a>
<a href="#billing" class="navlink">Billing</a>
</nav>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" class="ibtn" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0v4l2 3H4l2-3z"></path><path d="M10 20h4"></path></svg></button>
<span aria-label="Account: Jay" style="width: 36px; height: 36px; border-radius: 50%; background: #1F1D1C; color: #FAF8F4; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">J</span>
</div>
</div>
</header>
<main class="wrap" style="padding-top: 28px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 28px">
<a href="#assistants" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: #5C5754; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5754" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Assistants</a><nav aria-label="New Assistant steps"><ol style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 10px"><li style="display: flex; align-items: center; gap: 8px"><a href="#setup" style="display: flex; align-items: center; gap: 8px; text-decoration: none"><span style="width: 26px; height: 26px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; border: 1px solid #1F1D1C; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F1D1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"></path></svg></span><span class="st-lbl">Setup</span></a></li><li aria-hidden="true" style="flex: 1 1 24px; min-width: 16px; height: 1px; background: #D9D2C7"></li><li style="display: flex; align-items: center; gap: 8px"><a href="#review" style="display: flex; align-items: center; gap: 8px; text-decoration: none"><span style="width: 26px; height: 26px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; border: 1px solid #1F1D1C; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F1D1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"></path></svg></span><span class="st-lbl">Review &amp; test</span></a></li><li aria-hidden="true" style="flex: 1 1 24px; min-width: 16px; height: 1px; background: #D9D2C7"></li><li aria-current="step" style="display: flex; align-items: center; gap: 8px"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #1F1D1C; color: #FAF8F4; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">3</span><span class="st-lbl cur" style="font-weight: 600">Publish &amp; connect</span><span class="hint" style="white-space: nowrap">· Step 3 of 3</span></li></ol></nav>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 class="serif" style="margin: 0; font-size: 34px; line-height: 1.15">Publish, then connect a channel</h1>
<p style="margin: 0; color: #5C5754">Mochi Pet Co. support</p>
</div>
<div class="two">
<div style="display: flex; flex-direction: column; gap: 20px; min-width: 0">
<section class="panel" aria-labelledby="pub-title">
<div class="phead"><h2 id="pub-title" style="margin: 0; font-size: 16px; font-weight: 600">1. Publish changes</h2><span class="{{pubTagClass}}">{{pubTag}}</span></div>
<template data-if="{{notPublished}}">
<div style="padding: 6px 18px 20px; display: flex; flex-direction: column; gap: 16px">
<dl style="margin: 0"><div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #EDE8E0"><dt style="color: #5C5754">Document</dt><dd class="mono" style="margin: 0; font-size: 14px">returns-policy.pdf</dd></div><div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #EDE8E0"><dt style="color: #5C5754">Passages</dt><dd class="mono" style="margin: 0; font-size: 14px">47</dd></div><div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #EDE8E0"><dt style="color: #5C5754">Edited by you</dt><dd class="mono" style="margin: 0; font-size: 14px">2</dd></div><div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #EDE8E0"><dt style="color: #5C5754">Warnings (not blocking)</dt><dd class="mono" style="margin: 0; font-size: 14px">2</dd></div></dl>
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap"><button type="button" class="btn btn-dark" onClick="{{publish}}">Publish changes</button><a href="#review" class="hint" style="text-decoration: underline; text-underline-offset: 3px">Back to review</a></div>
<span class="hint">Customers keep the current version until publishing finishes.</span>
</div>
</template>
<template data-if="{{published}}">
<div style="padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="display: inline-flex; align-items: center; gap: 8px"><span class="dot" style="background: #5E9A55"></span><span style="font-weight: 500">Live · published today at 11:20</span><span class="mono hint">47 Passages</span></span>
<a href="#history" class="hint" style="text-decoration: underline; text-underline-offset: 3px">Version history</a>
</div>
</template>
</section>

<section class="panel" aria-labelledby="ch-title" style="{{chStyle}}">
<div class="phead"><h2 id="ch-title" style="margin: 0; font-size: 16px; font-weight: 600">2. Connect Discord</h2><span class="hint">{{chCount}}</span></div>
<template data-if="{{notPublished}}"><p style="margin: 0; padding: 18px; color: #6B6561">Available after you publish. The bot answers only from published content.</p></template>
<template data-if="{{published}}">
<div style="padding: 6px 18px 20px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid #EDE8E0">
<div style="display: flex; flex-direction: column"><span class="lbl">RAGcat bot</span><span class="hint">Added to the Mochi Pet Co. server</span></div>
<button type="button" class="btn-text" style="font-size: 14px">Change server</button>
</div>
<fieldset style="margin: 0; padding: 14px 0 0; border: 0; min-width: 0">
<legend class="lbl" style="padding: 14px 0 0">Channels</legend>
<div style="margin-top: 8px; border: 1px solid #E4DED5; border-radius: 8px; overflow: hidden">
<template data-for="{{channels}}" data-as="c">
<label style="{{c.rowStyle}}"><input type="checkbox" checked="{{c.checked}}" disabled="{{c.disabled}}" onChange="{{c.toggle}}" style="width: 18px; height: 18px; margin: 0; accent-color: #1F1D1C"><span class="mono" style="font-size: 14px; flex-grow: 1">{{c.name}}</span><span class="hint">{{c.note}}</span></label>
</template>
</div>
<p class="hint" style="margin: 8px 0 0">A channel can be connected to one Assistant at a time.</p>
</fieldset>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px">
<span class="lbl">Behaviour</span>
<ul style="margin: 0; padding: 0 0 0 18px; color: #4B4643; font-size: 15px; display: flex; flex-direction: column; gap: 4px">
<li>Replies only when mentioned or replied to</li>
<li>Cites the document and page, never a file link</li>
<li>Refers unanswered questions to <span class="mono" style="font-size: 14px">help@mochipet.example</span></li>
</ul>
</div>
</div>
</template>
</section>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<button type="button" class="btn-text">Skip for now</button>
<button type="button" class="btn btn-dark" disabled="{{cannotFinish}}">Finish</button>
</div>
</div>

<aside class="panel" aria-labelledby="pv-title">
<div class="phead"><h2 id="pv-title" style="margin: 0; font-size: 15px; font-weight: 600">Preview</h2><span class="mono hint"># help-desk</span></div>
<div style="padding: 18px; display: flex; flex-direction: column; gap: 16px; font-size: 14px">
<div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #E9E3DA; display: inline-flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6561" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg></span><div style="display: flex; flex-direction: column"><span class="hint" style="font-size: 12px">customer</span><span>@RAGcat can I return an opened bag of kibble?</span></div></div>
<div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 6px; background: #1F1D1C; display: inline-flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14V4.5l6.5 4.5h9L27 4.5V14c0 7.2-4.9 13-11 13S5 21.2 5 14z" fill="#FAF8F4"></path><circle cx="12.2" cy="16" r="3" fill="#1F1D1C"></circle><circle cx="19.8" cy="16" r="3" fill="#1F1D1C"></circle><rect x="15" y="15.3" width="2" height="1.4" fill="#1F1D1C"></rect></svg></span><div style="display: flex; flex-direction: column; gap: 6px"><span class="hint" style="font-size: 12px">RAGcat · bot</span><span style="line-height: 1.6">Only if the item is defective. Please contact support within 7 days with a photo.</span><span class="mono" style="align-self: flex-start; padding: 2px 8px; border-radius: 4px; background: #F4F0E9; font-size: 12px">Source: returns-policy.pdf, p. 3</span></div></div>
</div>
</aside>
</div>
</main>
</div>
</template>
<script src="dc-runtime.js"></script>
<script>
const CHANNELS = [
  { id: "help", name: "#help-desk" },
  { id: "returns", name: "#returns" },
  { id: "general", name: "#general" },
  { id: "wholesale", name: "#wholesale", taken: "Used by Wholesale help" }
];
class Component extends DCLogic {
  state = { published: null, picked: { help: true, returns: true } };
  renderVals() {
    const published = this.state.published ?? (this.props.startPublished ?? true);
    const picked = this.state.picked;
    const n = Object.keys(picked).filter((k) => picked[k]).length;
    return {
      published, notPublished: !published,
      publish: () => this.setState({ published: true }),
      pubTag: published ? "Done" : "1 Document changed",
      pubTagClass: published ? "chip chip-neutral" : "chip chip-attn",
      chStyle: published ? "" : "opacity: 0.6",
      chCount: published ? n + " selected" : "Locked",
      cannotFinish: !(published && n > 0),
      channels: CHANNELS.map((c, i) => ({
        name: c.name, checked: !!picked[c.id], disabled: !!c.taken,
        note: c.taken || (picked[c.id] ? "Will answer here" : ""),
        toggle: () => this.setState({ picked: { ...this.state.picked, [c.id]: !this.state.picked[c.id] } }),
        rowStyle: "display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; background: #FFFFFF; " + (i > 0 ? "border-top: 1px solid #EDE8E0; " : "") + (c.taken ? "color: #8A837E; cursor: not-allowed" : "cursor: pointer")
      }))
    };
  }
}
DC.mount(Component, {"startPublished": {"editor": "boolean", "default": true}});
</script>
</body>
</html>
