[project]
name = "ragcat"
version = "0.1.0"
description = "RAGcat backend: curation, ingestion, indexing and answering services"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "pymupdf>=1.25",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
